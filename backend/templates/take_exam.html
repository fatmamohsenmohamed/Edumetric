<!doctype html>
<html>
  <head>
    <title>{{ exam.title }}</title>
  </head>

  <body>
    <h1>{{ exam.title }}</h1>

    <form method="POST" action="{% url 'submit_exam' exam.id %}">
      {% csrf_token %}

      {% for question in questions %}
        <div style="margin-bottom: 20px;">
          <h3>{{ forloop.counter }}. {{ question.text }}</h3>

          {% if question.question_type == "mcq" %}

            {% for choice in question.shuffled_choices %}
              <label>
                <input
                  type="radio"
                  name="question_{{ question.id }}"
                  value="{{ choice.id }}"
                />
                {{ choice.text }}
              </label>
              <br />
            {% endfor %}

          {% elif question.question_type == "tf" %}

            <label>
              <input type="radio" name="question_{{ question.id }}" value="true" />
              True
            </label>
            <br />

            <label>
              <input type="radio" name="question_{{ question.id }}" value="false" />
              False
            </label>

          {% endif %}

        </div>
      {% endfor %}

      <button type="submit">Submit Exam</button>
    </form>
  </body>
</html>
